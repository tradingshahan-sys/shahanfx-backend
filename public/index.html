<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShahanFX AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="logo">
        <span>⚡</span>
        <div>
          <h1>ShahanFX</h1>
          <p>AI Trading Assistant</p>
        </div>
      </div>

      <div class="status">
        <i></i>
        Online
      </div>
    </header>

    <section class="hero">
      <div class="hero-icon">🤖</div>

      <h2>بەخێربێیت بۆ ShahanFX AI</h2>

      <p>
        یارمەتیدەری زیرەک بۆ Forex، ICT و SMC
      </p>
    </section>

    <section class="chat-box">

      <div id="messages" class="messages">

        <div class="message ai">
          <div class="avatar">🤖</div>

          <div class="bubble">
            سڵاو 👋<br><br>

            من <strong>ShahanFX AI</strong> ـم.
            دەتوانیت پرسیارم لەسەر Forex،
            ICT، SMC و شیکردنەوەی Chart بکەیت.
          </div>
        </div>

      </div>

      <div class="image-preview" id="imagePreview"></div>

      <div class="input-area">

        <label class="upload">
          📷
          <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
          >
        </label>

        <textarea
          id="messageInput"
          placeholder="پرسیارەکەت بنووسە..."
          rows="1"
        ></textarea>

        <button id="sendBtn" type="button">
          ➤
        </button>

      </div>

    </section>

    <div class="quick-actions">

      <button type="button"
        onclick="quickQuestion('XAUUSD ئێستا چۆن شیکاربکەم؟')">
        🥇 XAUUSD
      </button>

      <button type="button"
        onclick="quickQuestion('FVG چییە و چۆن بەکاری بهێنم؟')">
        📊 FVG
      </button>

      <button type="button"
        onclick="quickQuestion('Liquidity Sweep چۆن بناسمەوە؟')">
        💧 Liquidity
      </button>

      <button type="button"
        onclick="quickQuestion('BOS و CHOCH جیاوازییان چییە؟')">
        🔥 BOS / CHOCH
      </button>

    </div>

    <footer>
      ShahanFX AI • ICT • SMC • Forex
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
