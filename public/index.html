<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALC ShahanFx AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* گۆڕانکاری و وردەکاری دیزاینی تایبەت بۆ لۆگۆ و بچووککردنەوەی دەقەکان */
    .header .logo img, .hero .hero-icon img, .message.ai .avatar img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #d4af37;
    }
    .hero .hero-icon {
      font-size: unset;
      background: none;
    }
    /* بچووککردنەوەی قەبارەی کۆمێنت و دەقەکان بۆ سەر موبایل و کۆمپیوتەر */
    body {
      font-size: 13px;
    }
    .message .bubble {
      font-size: 12.5px;
      padding: 10px 12px;
      line-height: 1.5;
    }
    .hero h2 {
      font-size: 18px;
    }
    .hero p {
      font-size: 12px;
    }
    .quick-actions button {
      font-size: 11.5px;
      padding: 6px 10px;
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="logo">
        <img src="1000135879.jpg" alt="ALC ShahanFx Logo">
        <div>
          <h1>ALC ShahanFx</h1>
          <p>AI Trading Assistant</p>
        </div>
      </div>

      <div class="status">
        <i></i>
        Online
      </div>
    </header>

    <section class="hero">
      <div class="hero-icon">
        <img src="1000135879.jpg" alt="ALC ShahanFx Logo">
      </div>

      <h2>بەخێربێیت بۆ ALC ShahanFx AI</h2>

      <p>
        یارمەتیدەری زیرەک بۆ Forex، ICT و SMC
      </p>
    </section>

    <section class="chat-box">

      <div id="messages" class="messages">

        <div class="message ai">
          <div class="avatar">
            <img src="1000135879.jpg" alt="Logo">
          </div>

          <div class="bubble">
            سڵاو 👋<br><br>

            من <strong>ALC ShahanFx AI</strong> ـم (بە سەرپەرشتی و دیزاینی تایبەتی خۆم).
            دەتوانیت پرسیارم لەسەر Forex،
            ICT، SMC و شیکردنەوەی Chart بکەیت.
          </div>
        </div>

      </div>

      <div class="image-preview" id="imagePreview"></div>

      <div class="input-area">

        <label class="upload">
          📷
          <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
          >
        </label>

        <textarea
          id="messageInput"
          placeholder="پرسیارەکەت بنووسە..."
          rows="1"
        ></textarea>

        <button id="sendBtn">
          ➤
        </button>

      </div>

    </section>

    <div class="quick-actions">

      <button onclick="quickQuestion('XAUUSD ئێستا چۆن شیکاربکەم؟')">
        🥇 XAUUSD
      </button>

      <button onclick="quickQuestion('FVG چییە و چۆن بەکاری بهێنم؟')">
        📊 FVG
      </button>

      <button onclick="quickQuestion('Liquidity Sweep چۆن بناسمەوە؟')">
        💧 Liquidity
      </button>

      <button onclick="quickQuestion('BOS و CHOCH جیاوازییان چییە؟')">
        🔥 BOS / CHOCH
      </button>

    </div>

    <footer>
      ALC ShahanFx AI • ICT • SMC • Forex
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
