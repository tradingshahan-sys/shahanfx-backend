<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShahanFx AI Advisor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }
    .app {
      width: 100%;
      max-width: 420px;
      height: 92vh;
      background: #09090b;
      border: 1px solid #1c1917;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .header {
      padding: 10px 12px;
      background: #000;
      border-bottom: 1px solid #1c1917;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      text-align: center;
    }
    .logo { color: #f59e0b; font-size: 18px; font-weight: bold; }
    .clocks {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .clock-badge {
      font-size: 10px;
      background: #18181b;
      border: 1px solid #27272a;
      padding: 2px 6px;
      border-radius: 6px;
      color: #e4e4e7;
    }
    .clock-badge span { color: #f59e0b; font-weight: bold; }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 88%;
      padding: 9px 12px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ai { align-self: flex-start; background: #18181b; color: #f4f4f5; border: 1px solid #27272a; border-bottom-right-radius: 2px; }
    .user { align-self: flex-end; background: #f59e0b; color: #000; font-weight: 500; border-bottom-left-radius: 2px; }
    .bottom {
      padding: 8px 10px;
      background: #000;
      border-top: 1px solid #1c1917;
    }
    .row { display: flex; gap: 6px; }
    input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #27272a;
      background: #18181b;
      color: #fff;
      outline: none;
      font-family: inherit;
      font-size: 12px;
    }
    input:focus { border-color: #f59e0b; }
    button {
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      background: #f59e0b;
      color: #000;
      font-family: inherit;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #d97706; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">
      <div class="logo">ShahanFx Advisor</div>
      <div class="clocks">
        <div class="clock-badge">NY <span id="ny-time">--:--</span></div>
        <div class="clock-badge">London <span id="lon-time">--:--</span></div>
        <div class="clock-badge">KRG <span id="krg-time">--:--</span></div>
      </div>
    </div>

    <div id="chat" class="chat">
      <div class="message ai">سڵاو برام! من ShahanFx مە. ئامادەم وەک تریدەرێکی پرۆفیشناڵ یارمەتیت بدەم لە شیکارکردنی بازاڕ، FVG و ئۆردەر بڵۆکەکان. فەرموو چیت هەیە؟</div>
    </div>

    <div class="bottom">
      <div class="row">
        <input id="user-input" type="text" placeholder="پەیامەکەت بنووسە..." autocomplete="off">
        <button id="send-button" type="button">ناردن</button>
      </div>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6K1acWMnS4vOIq-QlXDUWH78vrvVrCh_55wOdg1oqFf4Q";
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

    function updateClocks() {
      const now = new Date();
      document.getElementById('ny-time').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit' });
      document.getElementById('lon-time').textContent = now.toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' });
      document.getElementById('krg-time').textContent = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Baghdad', hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    const input = document.getElementById("user-input");
    const chat = document.getElementById("chat");
    const button = document.getElementById("send-button");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      button.disabled = true;
      button.textContent = "⏳";

      const loadingMsg = addMessage("خەریکی بیرکردنەوە و شیکارکردنم...", "ai");

      try {
        const response = await fetch(GEMINI_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: "تو وەک ڕاوێژکارێکی پرۆفیشناڵی فۆڕێکس و زێڕ کار دەکەیت (به زمانی کوردی وەڵام بدەرەوە و گرنگی بە Smart Money، FVG و ئۆردەر بڵۆک بدە). پرسیاری بەکارهێنەر: " + text }]
            }]
          })
        });

        const data = await response.json();
        loadingMsg.remove();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          addMessage(data.candidates[0].content.parts[0].text, "ai");
        } else if (data.error) {
          addMessage("هەڵەی API: " + data.error.message, "ai");
        } else {
          addMessage("وەڵامێک نەدۆزراوەتەوە.", "ai");
        }
      } catch (error) {
        loadingMsg.remove();
        addMessage("برام، کێشەیەک هەیە لە پەیوەندیکردن.", "ai");
      }

      button.disabled = false;
      button.textContent = "ناردن";
    }

    button.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
    });
  </script>

</body>
</html>
